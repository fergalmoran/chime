# Runs the Android app's unit tests on pushes to trunk and pull requests that touch it. Releases (and their
# own test run) are android.yml, triggered by android-v* tags; this workflow needs no secrets and builds nothing.
name: Android tests

on:
  push:
    branches: [trunk]
    paths:
      - "android/**"
      - ".github/workflows/android-test.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/trunk' }}

      # No google-services.json here: the build skips the Firebase plugin without it, which unit tests don't need.
      - run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          retention-days: 7
