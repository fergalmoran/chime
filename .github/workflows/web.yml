# Type-checks, lints and tests the web app, then builds its Docker image. Images are only published
# for release tags: pushing `web-v1.2.3` (scripts/release-web.sh) publishes :1.2.3, :1.2, :latest and
# :sha-<commit> (pre-releases like web-v1.2.3-rc.1 get only :1.2.3-rc.1 and the SHA tag). Pushes to
# trunk and pull requests that touch web/ run the checks only. A manual run builds and publishes only
# the :sha-<commit> tag.
#
# VITE_API_URL / VITE_GOOGLE_CLIENT_ID are compiled into the bundle. They default to production
# in the Dockerfile; override them with repository variables of the same name if they change.
name: Web

on:
  push:
    branches: [trunk]
    tags: ["web-v*"]
    paths: # applies to trunk pushes only; GitHub ignores path filters for tag pushes
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check and test
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run check
      - run: bun test

  image:
    name: Docker image
    needs: test
    # Release tags and manual runs only. Trunk pushes and pull requests just run the tests, so nothing
    # that watches the registry ever sees an unreleased image.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # web-v1.2.3 -> 1.2.3 (metadata-action's semver parser doesn't know about the prefix).
      - name: Version from tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" == web-v* ]]; then
            echo "version=${REF_NAME#web-v}" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.version != '' && !contains(steps.version.outputs.version, '-') }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=sha,format=long
            type=ref,event=pr

      # amd64 only: the target host (noodles) is x86_64.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ vars.VITE_API_URL && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}
            ${{ vars.VITE_GOOGLE_CLIENT_ID && format('VITE_GOOGLE_CLIENT_ID={0}', vars.VITE_GOOGLE_CLIENT_ID) || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
